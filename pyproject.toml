[project]
name = "ansible-live"
version = "0.0.0"
description = "Watch a running ansible-playbook from a Claude Code pane."
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ansible-core>=2.21,<2.22",
    "hypothesis>=6",
    "jsonschema>=4.23",
    "mutmut>=3.8.0",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["contract/tests", "ansible_collections/igouss/ansible_live/tests", "viewer/tests/follower"]
pythonpath = ["contract", "."]

[tool.mutmut]
source_paths = ["ansible_collections/igouss/ansible_live/plugins/", "viewer/plugin/follower/"]
pytest_add_cli_args = ["--hypothesis-profile=mutation", "--ignore=ansible_collections/igouss/ansible_live/tests/test_runs.py", "--ignore=viewer/tests/follower/test_process.py"]
pytest_add_cli_args_test_selection = ["ansible_collections/igouss/ansible_live/tests/", "viewer/tests/follower/"]
also_copy = ["conftest.py", "contract/", "viewer/tests/follower/", "ansible_collections/igouss/ansible_live/tests/", "ansible_collections/igouss/ansible_live/galaxy.yml", "ansible_collections/igouss/ansible_live/meta/"]
